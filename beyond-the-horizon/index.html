<html lang="en">
<head>

<title>Beyond the Horizon</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#dock{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translate(-50%,14px);display:flex;gap:2px;padding:5px 7px;border-radius:24px;
  background:rgba(14,14,20,.22);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  border:1px solid rgba(255,255,255,.07);box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
#dock.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dock button{position:relative;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:rgba(255,255,255,.74);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,color .2s,transform .2s}
#dock button:hover{background:rgba(255,255,255,.11);color:#fff}
#dock button:active{transform:scale(.92)}
#dock button.on{color:#ffe2b0}
#dock .sep{width:1px;margin:8px 3px;background:rgba(255,255,255,.12)}
#dock svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

#joy{position:fixed;left:max(26px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;

#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.17);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.touch #joy{display:block}
body.touch #dock{gap:0;padding:4px 5px;max-width:calc(100vw - 16px)}
body.touch #dock button{width:36px;height:40px}
body.touch #dock .sep{margin:8px 1px}
body.touch #dock svg{width:20px;height:20px}
body.wall #dock,body.wall #joy{opacity:0!important;pointer-events:none!important}
body.wall canvas#world{cursor:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
#panel{position:fixed;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 54px);transform:translate(-50%,10px);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 110px);overflow:auto;
  padding:12px 14px;border-radius:18px;background:rgba(14,14,20,.42);-webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 40px rgba(0,0,0,.35);color:rgba(255,255,255,.82);font:500 12px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;
  opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease}

  background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:none;place-items:center;padding:0}
#pet{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 148px);width:54px;height:54px}
body.touch #joy{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 66px)}
body.touch #panel.show~#act,body.touch #panel.show~#pet,body.touch #panel.show~#feed{opacity:0;pointer-events:none}
#act svg,#pet svg,#feed svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
body.touch #act.show,body.touch #pet.show,body.touch #feed.show{display:grid}
#feed{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 214px);width:54px;height:54px}

  color:rgba(255,255,255,.85);font:600 11px system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none}
#hint b{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.18);font-size:10px}

body.touch #hint{display:none}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { edgeTable, triTable } from 'three/addons/objects/MarchingCubes.js';

/* =====================================================================
   BEYOND THE HORIZON — procedural cinematic world
   ===================================================================== */

const PARAMS = new URLSearchParams(location.search);
const IS_TOUCH = matchMedia('(pointer:coarse)').matches && !matchMedia('(pointer:fine)').matches;

function hasWebGL2() {
  try { const c = document.createElement('canvas'); return !!c.getContext('webgl2'); } catch (e) { return false; }
}
if (!hasWebGL2()) {
  document.getElementById('fallback').style.display = 'block';
  document.getElementById('veil').classList.add('gone');
  throw new Error('WebGL2 unavailable');
}

/* ---------- settings (persisted) & render-distance tiers ----------
   Resolution is never changed automatically: auto-adjust only trades render distance & detail. */
const DETAIL = [
  { grassNear: 60000,  grassMid: 30000,  flowers: 2000, nearR: 20, midR: 70,  shadowEvery: 4, bhSteps: 64,  skyScale: 0.5,  msaa: 0, shadow: 1024 },
  { grassNear: 110000, grassMid: 60000,  flowers: 4000, nearR: 25, midR: 100, shadowEvery: 3, bhSteps: 88,  skyScale: 0.62, msaa: 2, shadow: 2048 },
  { grassNear: 170000, grassMid: 90000,  flowers: 6000, nearR: 30, midR: 125, shadowEvery: 2, bhSteps: 112, skyScale: 0.8,  msaa: 4, shadow: 2048 },
  { grassNear: 240000, grassMid: 130000, flowers: 8000, nearR: 36, midR: 155, shadowEvery: 1, bhSteps: 150, skyScale: 1.0,  msaa: 4, shadow: 2048 },
];
const RES_LEVELS = [0.5, 0.75, 1.0];
const DEFAULTS = { detail: IS_TOUCH ? 0 : 2, autoDetail: true, res: IS_TOUCH ? 0 : (devicePixelRatio > 1.4 ? 1 : 2), bhOn: true, bhSize: 1, time: 'day', wind: 1, exp: 1, clouds: true, creatures: true, mist: true, sound: true };
const SETTINGS = { ...DEFAULTS };
try { Object.assign(SETTINGS, JSON.parse(localStorage.getItem('bth-settings') || '{}')); } catch (e) { /* storage unavailable */ }
{ const QMAP = { low: 0, medium: 1, high: 2, ultra: 3 }, qp = PARAMS.get('q'); if (qp in QMAP) { SETTINGS.detail = QMAP[qp]; SETTINGS.autoDetail = false; SETTINGS.res = 2; } }
if (PARAMS.has('bhsize')) SETTINGS.bhSize = +PARAMS.get('bhsize');
function saveSettings() { try { localStorage.setItem('bth-settings', JSON.stringify(SETTINGS)); } catch (e) { /* storage unavailable */ } }
const QN = IS_TOUCH ? 'low' : 'high'; // build-time tier: terrain mesh & forest density
const pixelRatioFor = (i) => Math.min(devicePixelRatio, 2) * RES_LEVELS[i];
const Q = Object.assign({ forest: IS_TOUCH ? 0.5 : 1.0, bloomRes: 0.5, pr: pixelRatioFor(SETTINGS.res) }, DETAIL[SETTINGS.detail]);
const FIXED_QUALITY = PARAMS.has('q') || PARAMS.has('freeze');

/* ---------- small math helpers ---------- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

/* ---------- deterministic value noise (JS, used for terrain & placement) ---------- */
function hash2(ix, iy) {
  let h = (Math.imul(ix | 0, 0x27d4eb2d) ^ Math.imul(iy | 0, 0x165667b1)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10), uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, oct) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * noise2(x, y); n += a; const nx = 0.8 * x - 0.6 * y, ny = 0.6 * x + 0.8 * y; x = nx * 2.03 + 17.1; y = ny * 2.03 - 9.7; a *= 0.5; }
  return s / n;
}
function ridged(x, y, oct) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { const v = 1 - Math.abs(noise2(x, y) * 2 - 1); s += a * v * v; n += a; const nx = 0.8 * x - 0.6 * y, ny = 0.6 * x + 0.8 * y; x = nx * 2.1 + 5.3; y = ny * 2.1 + 1.7; a *= 0.5; }
  return s / n;
}

/* ---------- renderer / camera ---------- */
const canvas = document.getElementById('world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false, alpha: false });
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const HFOV = 2 * Math.atan(18 / 35); // 35mm lens on a 36mm-wide gate
function fovFor(aspect) { return Math.min(2 * Math.atan(Math.tan(HFOV / 2) / aspect), 70 * DEG) / DEG; }
const camera = new THREE.PerspectiveCamera(fovFor(innerWidth / innerHeight), innerWidth / innerHeight, 0.12, 30000);
camera.rotation.order = 'YXZ';

/* ---------- world-space constants ---------- */
const WORLD_HALF = 1024;            // world texture covers [-1024,1024]^2
const GRID = 1024;                  // 2 m cells
const CELL = (2 * WORLD_HALF) / GRID;

// sun & black hole directions (world). Camera looks toward -Z (north).
function dirFromAzEl(az, el) { return V3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize(); }
const BH_AZ = -2.5 * DEG, BH_EL = 6.3 * DEG;
const BH_DIR = dirFromAzEl(BH_AZ, BH_EL);
const SUN_AZ = -104 * DEG, SUN_EL_DAY = 8.5 * DEG, SUN_EL_NIGHT = -11 * DEG;
const BH_LIGHT_DIR = dirFromAzEl(BH_AZ - 24 * DEG, 9 * DEG); // light arrives from the bright left limb of the disk

// tangent basis for the black hole (right, up, forward)
const bhF = BH_DIR.clone();

/* ---- far mountains: a ring of hazy ranges beyond the walkable land ---- */
function mountainH(x, z) {
  const r = Math.hypot(x, z);
  const az = Math.atan2(x, -z);
  const t = smoothstep(1500, 5200, r);
  const rid = ridged(x / 2400 + 3.1, z / 2400 - 1.7, 6);
  let h = 25 + (r - 1400) * 0.022 + t * (rid * 470 + fbm(x / 1400, z / 1400, 3) * 190);
  const dAz = angleDiff(az, BH_AZ);
  h *= 1 - 0.62 * Math.exp(-Math.pow(dAz / 0.45, 2)) * smoothstep(2200, 6000, r);
  return h - H_OFFSET * 0.3;
}
function buildMountains() {
  const NR = QN === 'low' ? 60 : 90, NA = QN === 'low' ? 420 : 720;
  const r0 = 1450, r1 = 15000;
  const pos = new Float32Array(NR * NA * 3);
  for (let j = 0; j < NR; j++) {
    const r = r0 * Math.pow(r1 / r0, j / (NR - 1));
    for (let i = 0; i < NA; i++) {
      const a = i / NA * Math.PI * 2;
      const x = Math.sin(a) * r, z = -Math.cos(a) * r, k = (j * NA + i) * 3;
      pos[k] = x; pos[k + 1] = mountainH(x, z); pos[k + 2] = z;
    }
  }
  const idx = [];
  for (let j = 0; j < NR - 1; j++) for (let i = 0; i < NA; i++) {
    const a0 = j * NA + i, b0 = j * NA + (i + 1) % NA, c0 = a0 + NA, d0 = b0 + NA;
    idx.push(a0, b0, c0, b0, d0, c0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const mat = stdMat({ color: 0xffffff, roughness: 0.95 }, {
    key: 'mountains', noCloud: false, noPoint: true,
    fColor: /* glsl */`
      vec2 q = vWorldP.xz;
      float slope = 1.0 - normalize(vWorldN).y;
      float n = fbm2(q*0.0021), m = vnoise(q*0.02);
      vec3 meadow = mix(srgb2lin(vec3(0.42, 0.40, 0.21)), srgb2lin(vec3(0.58, 0.48, 0.30)), n);
      vec3 forest = srgb2lin(vec3(0.13, 0.16, 0.09));
      vec3 rockc = srgb2lin(vec3(0.40, 0.38, 0.36));
      vec3 col = mix(meadow, forest, smoothstep(0.45, 0.6, n + (m - 0.5)*0.3) * (1.0 - smoothstep(380.0, 520.0, vWorldP.y)));
      col = mix(col, rockc*(0.7 + 0.5*m), smoothstep(0.25, 0.5, slope + (m - 0.5)*0.2));
      diffuseColor.rgb = col * (0.8 + 0.4*m);`,
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  return mesh;
}

/* =====================================================================
   SKY, BLACK HOLE (geodesic ray-traced), CLOUDS, STARS
   ===================================================================== */
// virtual observer around the hole (units of Schwarzschild radius)
const BH_D = 21.0, BH_TILT = 2.4 * DEG, BH_ROLL = -1.2 * DEG;
const BH_CAMPOS = V3(0, Math.sin(BH_TILT) * BH_D, -Math.cos(BH_TILT) * BH_D);
const BH_CAMROT = (() => {
  const f = BH_CAMPOS.clone().negate().normalize();
  let r = new THREE.Vector3().crossVectors(V3(0, 1, 0), f).normalize();
  let u = new THREE.Vector3().crossVectors(f, r).normalize();
  // roll
  const cr = Math.cos(BH_ROLL), sr = Math.sin(BH_ROLL);
  const r2 = r.clone().multiplyScalar(cr).add(u.clone().multiplyScalar(sr));
  const u2 = u.clone().multiplyScalar(cr).sub(r.clone().multiplyScalar(sr));
  // camera frame columns: right (x), up (y), forward (z) — tangent coords use x right, y up, z forward
  return new THREE.Matrix3().set(r2.x, u2.x, f.x, r2.y, u2.y, f.y, r2.z, u2.z, f.z);
})();

const SKY_UNIFORMS = {
  uBHCamPos: { value: BH_CAMPOS },
  uBHCamRot: { value: BH_CAMROT },
  uBHSteps: { value: Q.bhSteps },
  uBHExtent: { value: 0.62 },
  uBHShadowT: { value: 0.087 },
  uDiskBright: { value: 1 },
  uStars: { value: 0 },
  uEnvPass: { value: 0 },
};

const SKY_GLSL = /* glsl */`
uniform vec3 uBHCamPos; uniform mat3 uBHCamRot; uniform float uBHSteps; uniform float uBHExtent; uniform float uBHShadowT;
uniform float uDiskBright; uniform float uStars; uniform float uEnvPass;
const float RIN = 2.75, ROUT = 13.5;
float gPix = 0.001;

vec3 diskPalette(float x){
  // x: 0 = cool outer plasma, 1 = hottest inner region
  vec3 d0 = vec3(0.30, 0.075, 0.018), d1 = vec3(0.92, 0.36, 0.085), d2 = vec3(1.0, 0.66, 0.30), d3 = vec3(1.0, 0.86, 0.62), d4 = vec3(1.0, 0.97, 0.90);
  vec3 n0 = vec3(0.24, 0.02, 0.22), n1 = vec3(0.50, 0.06, 0.62), n2 = vec3(0.52, 0.22, 1.0), n3 = vec3(0.72, 0.56, 1.0), n4 = vec3(0.94, 0.90, 1.0);
  vec3 c0 = mix(d0, n0, uNight), c1 = mix(d1, n1, uNight), c2 = mix(d2, n2, uNight), c3 = mix(d3, n3, uNight), c4 = mix(d4, n4, uNight);
  x = clamp(x, 0.0, 1.0) * 4.0;
  if (x < 1.0) return mix(c0, c1, x);
  if (x < 2.0) return mix(c1, c2, x - 1.0);
  if (x < 3.0) return mix(c2, c3, x - 2.0);
  return mix(c3, c4, x - 3.0);
}

float diskPattern(float r, float ph, float seed){
  vec2 cs = vec2(cos(ph), sin(ph));
  float n1 = vnoise3(vec3(cs*2.1, r*2.2 + seed));
  float n2 = vnoise3(vec3(cs*4.8 + 7.0, r*6.3 - seed));
  float n3 = vnoise3(vec3(cs*10.5 - 3.0, r*17.0 + seed*1.7));
  float n4 = vnoise3(vec3(cs*22.0 + 1.0, r*41.0 - seed));
  float bands = 0.5 + 0.5*sin(r*7.5 + n1*5.0 + seed);
  float fil = pow(n3, 2.2)*1.3 + pow(n4, 3.0)*0.9;
  return clamp(0.20 + 0.55*n1*n2*1.6 + 0.35*bands*n2 + fil*0.55, 0.0, 2.2);
}

// returns rgb emission + alpha for one crossing of the disk plane
vec4 diskSample(vec3 hp, float r, vec3 rdir){
  float phi = atan(hp.z, hp.x);
  float inner = smoothstep(RIN*0.92, RIN*1.22, r);
  float outer = 1.0 - smoothstep(ROUT*0.45, ROUT, r);
  float prof = inner * outer * pow(RIN / r, 1.35);
  float om = 0.85 * pow(r, -1.5);
  const float TP = 80.0;
  float tA = mod(uTime, TP), tB = mod(uTime + TP*0.5, TP);
  float wA = 1.0 - abs(tA / TP * 2.0 - 1.0);
  float sA = floor(uTime / TP) * 3.17, sB = floor((uTime + TP*0.5) / TP) * 3.17 + 11.0;
  float n = diskPattern(r, phi - om*tA, sA) * wA + diskPattern(r, phi - om*tB, sB) * (1.0 - wA);
  float dens = prof * n;
  // relativistic Doppler beaming + gravitational redshift
  vec3 vdir = normalize(vec3(-hp.z, 0.0, hp.x));
  float beta = min(sqrt(0.5 / max(r - 1.0, 0.6)), 0.62);
  float gam = 1.0 / sqrt(1.0 - beta*beta);
  float g = sqrt(1.0 - 1.0 / r) / (gam * (1.0 + beta * dot(vdir, rdir)));
  float boost = mix(1.0, pow(g, 2.5), 0.8);
  float temp = clamp(pow(RIN / r, 0.75) * (0.62 + 0.45*n) * mix(1.0, g, 0.7), 0.0, 1.0);
  vec3 c = diskPalette(temp) * dens * boost * 7.5 * uDiskBright;
  c *= 14.0 / (14.0 + dot(c, vec3(0.3, 0.5, 0.2)));
  float thick = 0.10 + 0.08*n;
  float a = 1.0 - exp(-dens * thick * 7.0 / max(abs(rdir.y), 0.045));
  return vec4(c * (0.35 + 0.65*a), clamp(a, 0.0, 0.97));
}

vec3 bhToWorld(vec3 bdir){
  vec3 lc = bdir * uBHCamRot; // into camera tangent frame
  if (lc.z < 0.02) lc.z = 0.02;
  vec2 p = lc.xy / lc.z;
  return normalize(uBHBasis * normalize(vec3(p, 1.0)));
}

// trace a view direction through the curved space-time of the hole
vec3 traceBH(vec3 wdir, out vec3 escW, out float occl){
  occl = 0.0; escW = wdir;
  vec3 l = wdir * uBHBasis;
  if (l.z < 0.3) return vec3(0.0);
  vec2 p = l.xy / l.z;
  if (length(p * vec2(0.9, 1.25)) > uBHExtent) return vec3(0.0);
  vec3 rd = uBHCamRot * normalize(vec3(p, 1.0));
  vec3 pos = uBHCamPos;
  float bproj = dot(pos, rd);
  vec3 cperp = pos - rd * bproj; float b2 = dot(cperp, cperp);
  const float R0 = 15.0;
  if (b2 > R0*R0){
    float b = sqrt(b2);
    vec3 dout = normalize(rd - normalize(cperp) * (2.0 / b));
    escW = bhToWorld(dout);
    return vec3(0.0);
  }
  pos += rd * max(-bproj - sqrt(R0*R0 - b2), 0.0);
  vec3 vel = rd;
  vec3 hv = cross(pos, vel); float h2 = dot(hv, hv);
  vec3 col = vec3(0.0); float T = 1.0; bool cap = false;
  for (int i = 0; i < 200; i++){
    float r2 = dot(pos, pos); float r = sqrt(r2);
    if (float(i) >= uBHSteps) { cap = r < 2.2; break; }
    float dt = clamp((r - 0.85) * 0.125, 0.012, 1.4);
    vec3 prev = pos;
    vec3 acc = -1.5 * h2 * pos / (r2*r2*r);
    pos += vel*dt + 0.5*acc*dt*dt;
    float r2n = dot(pos, pos);
    vec3 accn = -1.5 * h2 * pos / (r2n*r2n*sqrt(r2n));
    vel += 0.5*(acc + accn)*dt;
    if (prev.y * pos.y < 0.0){
      float f = prev.y / (prev.y - pos.y);
      vec3 hp = mix(prev, pos, f);
      float rr = length(hp.xz);
      if (rr > RIN*0.9 && rr < ROUT){
        vec4 e = diskSample(hp, rr, normalize(vel));
        col += T * e.rgb; T *= 1.0 - e.a;
      }
    }
    if (r2n < 1.0){ cap = true; break; }
    if (r2n > 420.0 && dot(pos, vel) > 0.0) break;
    if (T < 0.015) break;
  }
  // razor-thin photon ring (critical impact parameter b = 3*sqrt(3)/2)
  float bimp = sqrt(h2);
  float pw = gPix * 30.0;
  float ring = exp(-pow((bimp - 2.598) / (0.006 + pw*0.35), 2.0));
  float ringSide = 0.55 + 0.45 * clamp(-(uBHCamRot * normalize(vec3(p, 1.0))).x * 6.0 + 0.5, 0.0, 1.0);
  col += diskPalette(0.95) * ring * 3.6 * ringSide * uDiskBright * T;

  occl = cap ? 1.0 : 1.0 - T;

}

vec3 starField(vec3 d){
  vec3 c = vec3(0.0);
  for (int k = 0; k < 2; k++){
    float sc = k == 0 ? 160.0 : 420.0;
    vec3 p = d * sc;
    vec3 id = floor(p);
    float h = hash13(id + float(k)*17.0);
    float th = k == 0 ? 0.955 : 0.93;
    if (h > th){
      vec3 sp = id + 0.5 + (vec3(hash13(id + 1.3), hash13(id + 2.7), hash13(id + 5.1)) - 0.5) * 0.7;
      float dd = length(p - sp);
      float br = pow((h - th) / (1.0 - th), 2.0) * (k == 0 ? 2.2 : 0.6);
      float tw = 0.75 + 0.25*sin(uTime*(1.5 + h*4.0) + h*60.0);
      vec3 tint = mix(vec3(0.75, 0.82, 1.0), vec3(1.0, 0.85, 0.7), hash13(id + 9.0));
      c += tint * br * tw * exp(-dd*dd*(k == 0 ? 26.0 : 40.0));
    }
  }

  vec3 gp = normalize(vec3(0.35, 0.62, -0.7));
  float band = exp(-pow(dot(d, gp) * 3.4, 2.0));
  float dust = fbm3(d * 6.0);
  c += vec3(0.55, 0.58, 0.75) * band * smoothstep(0.35, 0.8, dust) * 0.035;
  return c;
}

vec4 clouds(vec3 d){

  float det = fbm3(vec3(uv * 2.3 + 4.0, t * 2.0));

function placeShadowLight(light, dir, center, extent) {
  // snap the light-space origin to texels to keep shadows stable while walking
  const texel = (2 * extent) / light.shadow.mapSize.x;
  const m = new THREE.Matrix4().lookAt(V3(0, 0, 0), dir.clone().negate(), V3(0, 1, 0));

  light.position.copy(_lv).addScaledVector(dir, 300);
  light.target.updateMatrixWorld();
}

    for (let i = 0; i < 160; i++) { const a = rng() * 6.28, r = Math.sqrt(rng()) * im[2]; litter.push([im[0] + Math.cos(a) * r, im[1] + Math.sin(a) * r]); }
  }

/* =====================================================================
   PROCEDURAL SURFACE TEXTURES (canvas generated)
   ===================================================================== */
function sidingTextures() {
  const S = 1024, rows = 15; // 2.4 m tile, 16 cm clapboards

    const row = Math.floor(y / ph), f = (y % ph) / ph;
    const tone = 0.94 + 0.06 * hash2(row, 3);
    for (let xx = 0; xx < S; xx++) {
      const k = y * S + xx;
      const g = grain[((y * 4) % 256) * 256 + (xx >> 2) % 256];
      const ch = chipN[((y >> 2) % 256) * 256 + ((xx + row * 37) >> 2) % 256];
      const st = stain[((y >> 3) % 128) * 128 + (xx >> 3) % 128];
      const chip = ch > 0.735 ? 1 : 0;
      let h = 0.25 + 0.75 * f; // thicker toward the lower edge of every board

      hf[k] = h;
      let r = 236, gg = 233, b = 224;
      r *= tone; gg *= tone; b *= tone * 0.99;
      const streak = Math.max(0, st - 0.45) * 0.55 * (0.6 + 0.4 * Math.sin(xx * 0.05 + row));
      r -= streak * 70; gg -= streak * 72; b -= streak * 70;
      if (chip) { const w = 168 + g * 40; r = w * 0.98; gg = w * 0.95; b = w * 0.88; }
      if (f > 0.9) { const s = (f - 0.9) * 10; r *= 1 - 0.45 * s; gg *= 1 - 0.45 * s; b *= 1 - 0.43 * s; }
      if (f < 0.06) { r *= 0.93; gg *= 0.93; b *= 0.93; }
      const i4 = k * 4; d[i4] = r; d[i4 + 1] = gg; d[i4 + 2] = b; d[i4 + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  return { map: canvasTex(c), normal: normalFromHeight(hf, S, S, 6) };
}
function shingleTextures() {
  const S = 1024, rows = 12, tabs = 6; // 2.0 m tile
  const c = makeCanvas(S, S), x = c.getContext('2d'), img = x.createImageData(S, S), d = img.data;
  const hf = new Float32Array(S * S);
  const gn = noiseField(256, 256, 16, 3, 33), lich = noiseField(128, 128, 6, 4, 44);
  const rh = S / rows, tw = S / tabs;
  for (let y = 0; y < S; y++) {
    const row = Math.floor(y / rh), f = (y % rh) / rh, off = (row % 2) * tw * 0.5 + hash2(row, 1) * tw * 0.3;
    for (let xx = 0; xx < S; xx++) {
      const k = y * S + xx;
      const xr = (xx + off) % S, tab = Math.floor(xr / tw), fx = (xr % tw) / tw;
      const slot = fx < 0.025 || fx > 0.975;
      const tone = 0.75 + 0.5 * hash2(tab + row * 13, 7);
      const g = gn[((y >> 2) % 256) * 256 + (xx >> 2) % 256];
      const li = lich[((y >> 3) % 128) * 128 + (xx >> 3) % 128];
      let h = 0.3 + 0.6 * f + (g - 0.5) * 0.12;
      if (slot) h = 0.1;
      if (f > 0.92) h = 0.15;
      hf[k] = h;

      let r = base * 0.95, gg = base * 0.97, b = base * 1.08;

      if (f < 0.08) { r *= 1.15; gg *= 1.15; b *= 1.12; }
      const i4 = k * 4; d[i4] = r; d[i4 + 1] = gg; d[i4 + 2] = b; d[i4 + 3] = 255;
    }

}
function brickTextures() {
  const S = 512, bw = S / 6, bh = S / 18; // 1.2 m tile

  const hf = new Float32Array(S * S);

function buildFence() {

    const a = posts[i], b = posts[i + 1];
    const d = Math.hypot(b.x - a.x, b.z - a.z); if (d > 3.2) continue;
    for (const hgt of [0.45, 0.95]) {

      if (r < 0.26 || (hgt > 0.6 && (a.h < 1 || b.h < 1))) {

        rails.push({ a: [a.x, ya, a.z], b: [b.x, yb, b.z] });

  { const p = pg.attributes.position; for (let i = 0; i < p.count; i++) if (p.getY(i) > 0.99) p.setY(i, p.getY(i) + (p.getX(i) > 0 ? 0.03 : -0.02)); pg.computeVertexNormals(); }

  for (const y of [0.15, 0.55, 0.95]) { const b = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, 0.04), mat); b.position.y = y; gate.add(b); }

  gate.position.set(-4.4, H(-4.4, -27.5) + 0.06, -27.5); gate.rotation.set(-Math.PI / 2 + 0.12, 0.4, 0.05);
  gate.traverse(o => { o.castShadow = o.receiveShadow = true; });

  return group;
}

const carOnly = { circles: [], boxes: [] }; // obstacles that stop the car but not a walking person (shrubs, small rocks)
function collideR(p, R, skip = null) {
  let hit = false;
  for (let it = 0; it < 3; it++) {
    for (const [cx, cz, r] of colliders.circles) {
      const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz), m = r + R;
      if (d < m && d > 1e-5) { p.x = cx + dx / d * m; p.z = cz + dz / d * m; hit = true; }
    }
    for (const [ax, az, bx, bz] of colliders.segs) {
      const vx = bx - ax, vz = bz - az, L2 = vx * vx + vz * vz;
      const t = clamp(((p.x - ax) * vx + (p.z - az) * vz) / L2, 0, 1);
      const qx = ax + vx * t, qz = az + vz * t, dx = p.x - qx, dz = p.z - qz, d = Math.hypot(dx, dz), m = R + 0.1;
      if (d < m && d > 1e-5) { p.x = qx + dx / d * m; p.z = qz + dz / d * m; hit = true; }
    }
    for (const b of colliders.boxes) {
      if (b === skip) continue;
      const [cx, cz, hx, hz, yaw] = b;
      const c = Math.cos(yaw), s = Math.sin(yaw), dx = p.x - cx, dz = p.z - cz;
      const lx = dx * c - dz * s, lz = dx * s + dz * c;
      const ex = hx + R - Math.abs(lx), ez = hz + R - Math.abs(lz);
      if (ex > 0 && ez > 0) {
        let nx = lx, nz = lz;
        if (ex < ez) nx = Math.sign(lx) * (hx + R); else nz = Math.sign(lz) * (hz + R);
        p.x = cx + nx * c + nz * s; p.z = cz - nx * s + nz * c; hit = true;
      }
    }
  }
  const r = Math.hypot(p.x, p.z + 120);
  if (r > 980) { p.x *= 980 / r; p.z = (p.z + 120) * 980 / r - 120; hit = true; }
  return hit;
}

/* ---------- a mesh builder for organic plant parts ---------- */
function plantBuilder() {
  const P = [], C = [], X = [], I = [];
  const B = {
    v(p, c, u, v, part) { P.push(p[0], p[1], p[2]); C.push(c[0], c[1], c[2]); X.push(u, v, part); return P.length / 3 - 1; },
    // a closed tube along f(s) (s∈[0,1]) with radius r(s) and colour col(s)
    tube(f, r, segs, sides, col, part) {
      const base = P.length / 3;
      for (let i = 0; i <= segs; i++) {
        const s = i / segs, p = f(s), p2 = f(Math.min(1, s + 0.01)), p1 = f(Math.max(0, s - 0.01));
        const t = V3(p2[0] - p1[0], p2[1] - p1[1], p2[2] - p1[2]).normalize();
        const a = Math.abs(t.y) < 0.9 ? V3(0, 1, 0) : V3(1, 0, 0);
        const n1 = new THREE.Vector3().crossVectors(t, a).normalize(), n2 = new THREE.Vector3().crossVectors(t, n1);
        const rr = r(s), c = col(s);
        for (let k = 0; k < sides; k++) {
          const ang = k / sides * Math.PI * 2, ca = Math.cos(ang), sa = Math.sin(ang);
          B.v([p[0] + (n1.x * ca + n2.x * sa) * rr, p[1] + (n1.y * ca + n2.y * sa) * rr, p[2] + (n1.z * ca + n2.z * sa) * rr], c, k / sides * 2 - 1, s, part);
        }
      }
      for (let i = 0; i < segs; i++) for (let k = 0; k < sides; k++) {
        const a = base + i * sides + k, b = base + i * sides + (k + 1) % sides, c = a + sides, d = b + sides;
        I.push(a, c, b, b, c, d);
      }
    },
    // a strip grid: pos(u,v) for u∈[-1,1] (across) and v∈[0,1] (along)
    sheet(pos, cols, rows, col, part) {
      const base = P.length / 3;
      for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) { const u = i / cols * 2 - 1, v = j / rows; B.v(pos(u, v), col(u, v), u, v, part); }

        const a = base + j * (cols + 1) + i, b = a + 1, c = a + cols + 1, d = c + 1;
        I.push(a, b, c, b, d, c);
      }
    },
    geometry() {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
      g.setAttribute('aPlant', new THREE.Float32BufferAttribute(X, 3));
      g.setIndex(I); g.computeVertexNormals(); g.computeBoundingSphere();
      return g;
    },
  };
  return B;
}

function interact() {
  if (state.mode === 'drive') { exitCar(); return; }
  if (state.mode !== 'explore') { setMode('explore'); return; }
  if (life.feed && life.feed.kind === 'ground') { endFeed(); return; }
  if (life.held) { putDown(); return; }
  if (life.near) { pickUp(life.near); return; }

}

}

  if (state.mode === 'drive') return 'exit';
  if (state.mode !== 'explore') return null;
  if (life.feed && life.feed.kind === 'ground') return 'feeding';
  if (life.held) return 'down';
  if (life.near) return 'pick';

  if (e.code === 'KeyH') setWall(!state.wall);

  dbg: { SKY_UNIFORMS, particles, U, sky, scene, walkHeight, toHouseLocal, fromHouseLocal, FLOOR_Y, H, HOUSE, input, CAR, car, life, food, interact, pickUp, putDown, feed, startFeed, endFeed, refillBowl, carHits, carOnly, colliders, REFL, FARM, vegLayers, terrain, sun, bhLight, stream, renderer, enterCar, exitCar, drive, setSetting, SETTINGS, goLocation, director, nextShot, SHOTS, arms },
  info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geo: renderer.info.memory.geometries, tex: renderer.info.memory.textures, pr: pixelRatio, detail: curDetail }),
};
if (PARAMS.get('view')) setView(PARAMS.get('view'));
if (PARAMS.get('mode') === 'cine') setMode('cine');
applyLighting(state.tr);
updateEnvironment();
for (const l of [sun, bhLight]) l.shadow.needsUpdate = true;
if (PARAMS.has('manual')) { window.__bth.ready = true; document.getElementById('veil').classList.add('gone'); }
else { loop(); window.__bth.ready = true; }
</script>
</body>
</html>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   BEYOND THE HORIZON — procedural cinematic world
   ===================================================================== */

const PARAMS = new URLSearchParams(location.search);
const IS_TOUCH = matchMedia('(pointer:coarse)').matches && !matchMedia('(pointer:fine)').matches;

function hasWebGL2() {
  try { const c = document.createElement('canvas'); return !!c.getContext('webgl2'); } catch (e) { return false; }
}
if (!hasWebGL2()) {
  document.getElementById('fallback').style.display = 'block';
  document.getElementById('veil').classList.add('gone');
  throw new Error('WebGL2 unavailable');
}

/* ---------- quality tiers ---------- */
const QUALITY = {
  high:   { pr: Math.min(devicePixelRatio, 1.5), msaa: 4, grassNear: 210000, grassMid: 110000, flowers: 7000, shadow: 2048, bhSteps: 130, forest: 1.0, bloomRes: 0.5, nearR: 34, midR: 130 },
  medium: { pr: Math.min(devicePixelRatio, 1.0), msaa: 2, grassNear: 100000, grassMid: 70000,  flowers: 4500, shadow: 2048, bhSteps: 95,  forest: 0.7, bloomRes: 0.5, nearR: 28, midR: 110 },
  low:    { pr: Math.min(devicePixelRatio, 1.0) * 0.8, msaa: 0, grassNear: 42000, grassMid: 30000, flowers: 2000, shadow: 1024, bhSteps: 64, forest: 0.4, bloomRes: 0.35, nearR: 22, midR: 85 },
};
let QN = PARAMS.get('q') || (IS_TOUCH ? 'low' : 'high');
if (!QUALITY[QN]) QN = 'high';
const Q = QUALITY[QN];
const FIXED_QUALITY = PARAMS.has('q') || PARAMS.has('freeze');

/* ---------- small math helpers ---------- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

/* ---------- deterministic value noise (JS, used for terrain & placement) ---------- */
function hash2(ix, iy) {
  let h = (Math.imul(ix | 0, 0x27d4eb2d) ^ Math.imul(iy | 0, 0x165667b1)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10), uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, oct) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * noise2(x, y); n += a; const nx = 0.8 * x - 0.6 * y, ny = 0.6 * x + 0.8 * y; x = nx * 2.03 + 17.1; y = ny * 2.03 - 9.7; a *= 0.5; }
  return s / n;
}
function ridged(x, y, oct) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { const v = 1 - Math.abs(noise2(x, y) * 2 - 1); s += a * v * v; n += a; const nx = 0.8 * x - 0.6 * y, ny = 0.6 * x + 0.8 * y; x = nx * 2.1 + 5.3; y = ny * 2.1 + 1.7; a *= 0.5; }
  return s / n;
}

/* ---------- renderer / camera ---------- */
const canvas = document.getElementById('world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false, alpha: false });
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const HFOV = 2 * Math.atan(18 / 35); // 35mm lens on a 36mm-wide gate
function fovFor(aspect) { return Math.min(2 * Math.atan(Math.tan(HFOV / 2) / aspect), 70 * DEG) / DEG; }
const camera = new THREE.PerspectiveCamera(fovFor(innerWidth / innerHeight), innerWidth / innerHeight, 0.12, 30000);
camera.rotation.order = 'YXZ';

/* ---------- world-space constants ---------- */
const WORLD_HALF = 1024;            // world texture covers [-1024,1024]^2
const GRID = 1024;                  // 2 m cells
const CELL = (2 * WORLD_HALF) / GRID;

// sun & black hole directions (world). Camera looks toward -Z (north).
function dirFromAzEl(az, el) { return V3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize(); }
const BH_AZ = -2.5 * DEG, BH_EL = 6.3 * DEG;
const BH_DIR = dirFromAzEl(BH_AZ, BH_EL);
const SUN_AZ = -104 * DEG, SUN_EL_DAY = 8.5 * DEG, SUN_EL_NIGHT = -11 * DEG;
const BH_LIGHT_DIR = dirFromAzEl(BH_AZ - 24 * DEG, 9 * DEG); // light arrives from the bright left limb of the disk

// tangent basis for the black hole (right, up, forward)
const bhF = BH_DIR.clone();
const bhR = new THREE.Vector3().crossVectors(bhF, V3(0, 1, 0)).normalize();
const bhU = new THREE.Vector3().crossVectors(bhR, bhF).normalize();
const BH_BASIS = new THREE.Matrix3().set(bhR.x, bhU.x, bhF.x, bhR.y, bhU.y, bhF.y, bhR.z, bhU.z, bhF.z);

/* ---------- shared uniforms ---------- */
const U = {
  uTime: { value: 0 },
  uWindDir: { value: new THREE.Vector2(0.62, 0.78).normalize() },
  uWindStr: { value: 0.5 },
  uGust: { value: 0.5 },
  uNight: { value: 0 },      // black hole palette + night sky
  uSkyN: { value: 0 },       // sky darkness
  uDusk: { value: 0 },
  uSunUp: { value: 1 },
  uSunDir: { value: dirFromAzEl(SUN_AZ, SUN_EL_DAY) },
  uSunCol: { value: new THREE.Color(1, 0.8, 0.6) },
  uBHDir: { value: BH_DIR.clone() },
  uBHBasis: { value: BH_BASIS },
  uBHGlow: { value: new THREE.Color(1, 0.7, 0.4) },
  uFogDen: { value: 0.00028 },
  uFogH: { value: 260 },
  uMist: { value: 0.4 },
  uMistCol: { value: new THREE.Color(1, 0.9, 0.8) },
  uCloudOff: { value: new THREE.Vector2() },
  uCloudCov: { value: 1 },
  uWorldTex: { value: null },
  uRectA: { value: Array.from({ length: 8 }, () => new THREE.Vector4(1e5, 1e5, 1, 0)) },
  uRectB: { value: Array.from({ length: 8 }, () => new THREE.Vector4(0.1, 0.1, 0.5, 0)) },
  uInterior: { value: new THREE.Vector4(1e5, 1e5, 1e5, 0) },
};

/* ---------- shared GLSL ---------- */
const GLSL_COMMON = /* glsl */`
#ifndef BTH_COMMON
#define BTH_COMMON
uniform float uTime; uniform vec2 uWindDir; uniform float uWindStr; uniform float uGust;
uniform float uNight; uniform float uSkyN; uniform float uDusk; uniform float uSunUp;
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uBHDir; uniform mat3 uBHBasis; uniform vec3 uBHGlow;
uniform float uFogDen; uniform float uFogH; uniform float uMist; uniform vec3 uMistCol;
uniform vec2 uCloudOff; uniform float uCloudCov;
uniform sampler2D uWorldTex;
uniform vec4 uRectA[8]; uniform vec4 uRectB[8];

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), u.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), u.x), u.y); }
float vnoise3(vec3 p){ vec3 i = floor(p), f = fract(p); vec3 u = f*f*(3.0-2.0*f);
  float a = hash13(i), b = hash13(i+vec3(1,0,0)), c = hash13(i+vec3(0,1,0)), d = hash13(i+vec3(1,1,0));
  float e = hash13(i+vec3(0,0,1)), f1 = hash13(i+vec3(1,0,1)), g = hash13(i+vec3(0,1,1)), h = hash13(i+vec3(1,1,1));
  return mix(mix(mix(a,b,u.x), mix(c,d,u.x), u.y), mix(mix(e,f1,u.x), mix(g,h,u.x), u.y), u.z); }
float fbm2(vec2 p){ float s = 0.0, a = 0.5; mat2 R = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 4; i++){ s += a * vnoise(p); p = R * p * 2.03 + 11.1; a *= 0.5; } return s / 0.9375; }
float fbm3(vec3 p){ float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){ s += a * vnoise3(p); p = p * 2.02 + vec3(5.1, 1.3, 7.7); a *= 0.5; } return s / 0.9375; }
vec3 srgb2lin(vec3 c){ return pow(c, vec3(2.2)); }

vec2 bthWorldUV(vec2 xz){ return (xz + 1024.0) / 2048.0 + 0.5 / 1024.0; }
vec4 bthWorld(vec2 xz){ return texture(uWorldTex, bthWorldUV(xz)); }

// signed distance (xz) to the oriented exclusion rectangles (house, porch, car ...)
float bthRectDist(vec2 p){
  float d = 1e5;
  for (int i = 0; i < 8; i++){
    vec4 a = uRectA[i]; vec4 b = uRectB[i];
    vec2 q = p - a.xy; q = vec2(q.x*a.z - q.y*a.w, q.x*a.w + q.y*a.z);
    vec2 e = abs(q) - b.xy;
    d = min(d, length(max(e, 0.0)) + min(max(e.x, e.y), 0.0));
  }
  return d;
}

// shared procedural wind field: xy = displacement direction*strength, z = wave phase (sheen)
vec3 windField(vec2 p){
  float t = uTime; vec2 d = uWindDir;
  float along = dot(p, d);
  float g = vnoise(p*0.011 - d*t*0.085);
  float gust = smoothstep(0.38, 0.95, g);
  float wave = sin(along*0.19 - t*2.3 + vnoise(p*0.04)*4.0)*0.5 + 0.5;
  float wave2 = sin(along*0.53 - t*3.9 + vnoise(p*0.12 + 3.0)*3.0)*0.5 + 0.5;
  float s = uWindStr * (0.22 + 0.58*wave*wave + 0.2*wave2) * (0.6 + 1.25*gust*uGust);
  vec2 turb = vec2(vnoise(p*0.33 + t*0.9), vnoise(p*0.33 - t*0.8 + 17.0)) - 0.5;
  return vec3(d*s + turb*0.4*uWindStr, wave*wave*(0.4 + gust));
}

float bthDryness(vec2 p){
  float n = fbm2(p*0.010 + 3.7);
  float m = vnoise(p*0.07);
  return clamp(smoothstep(0.30, 0.70, n)*0.9 + (m - 0.5)*0.35 + 0.18, 0.0, 1.0);
}
float bthMeadow(vec2 p){ return smoothstep(0.28, 0.72, fbm2(p*0.018 - 5.1)); }

// analytic glow of the accretion disk scattered in the air (used by sky + fog + env)
vec3 bhGlow(vec3 d){
  vec3 l = d * uBHBasis;
  if (l.z <= 0.05) return vec3(0.0);
  vec2 p = l.xy / l.z;
  float e1 = exp(-length(p*vec2(1.5, 7.0))*2.6);
  float e2 = exp(-length(p*vec2(0.8, 2.4))*1.7);
  float hz = 1.0 + 1.5*exp(-max(d.y, 0.0)*28.0);
  return uBHGlow * (e1*0.75 + e2*0.16) * hz;
}

vec3 skyBase(vec3 d){
  float yc = max(d.y, 0.0);
  float sd = max(dot(d, uSunDir), 0.0);
  // golden-hour day: creamy amber horizon -> dusty blue -> muted indigo
  vec3 day = mix(vec3(1.06, 0.83, 0.60), vec3(0.40, 0.54, 0.74), smoothstep(0.0, 0.14, yc));
  day = mix(day, vec3(0.11, 0.17, 0.42), smoothstep(0.1, 0.62, yc));
  day += vec3(1.0, 0.70, 0.40) * (pow(sd, 5.0)*0.45 + pow(sd, 40.0)*0.9) * (1.0 - 0.6*smoothstep(0.0, 0.5, yc));
  // dusk: the sun sinks, horizon burns orange-rose, the zenith deepens
  vec3 dusk = mix(vec3(1.05, 0.46, 0.24), vec3(0.34, 0.26, 0.44), smoothstep(0.0, 0.3, yc));
  dusk = mix(dusk, vec3(0.05, 0.06, 0.15), smoothstep(0.25, 0.95, yc));
  dusk += vec3(1.0, 0.38, 0.14) * pow(sd, 3.0) * 0.9;
  // night: midnight blue, nearly black overhead
  vec3 night = mix(vec3(0.040, 0.034, 0.095), vec3(0.0035, 0.0045, 0.013), smoothstep(0.0, 0.42, yc));
  vec3 c = mix(day, dusk, uDusk);
  c = mix(c, night, uSkyN);
  // ground below the horizon (for reflections / environment lighting)
  vec3 gnd = mix(vec3(0.19, 0.16, 0.095)*(0.25 + 0.75*uSunUp), vec3(0.016, 0.013, 0.03), uSkyN);
  c = mix(c, gnd, smoothstep(0.0, -0.06, d.y));
  return c;
}

float cloudShadow(vec3 wp){
  float n = fbm2(wp.xz*0.0038 + uCloudOff);
  return 1.0 - 0.6*smoothstep(0.5, 0.74, n)*uCloudCov;
}

// aerial perspective, height fog and low-lying drifting mist
vec3 bthAtmos(vec3 col, vec3 wp){
  vec3 v = wp - cameraPosition; float d = length(v); vec3 vd = v / max(d, 1e-3);
  float H = uFogH;
  float dy = v.y;
  float k = abs(dy) > 0.05 ? (1.0 - exp(-dy/H)) / (dy/H) : 1.0;
  float od = uFogDen * exp(-max(cameraPosition.y + 5.0, 0.0)/H) * d * k;
  float fogA = 1.0 - exp(-od);

/* ---- far mountains: a ring of hazy ranges beyond the walkable land ---- */
function mountainH(x, z) {
  const r = Math.hypot(x, z);
  const az = Math.atan2(x, -z);
  const t = smoothstep(1500, 5200, r);
  const rid = ridged(x / 2400 + 3.1, z / 2400 - 1.7, 6);
  let h = 25 + (r - 1400) * 0.022 + t * (rid * 470 + fbm(x / 1400, z / 1400, 3) * 190);
  const dAz = angleDiff(az, BH_AZ);
  h *= 1 - 0.62 * Math.exp(-Math.pow(dAz / 0.45, 2)) * smoothstep(2200, 6000, r);
  return h - H_OFFSET * 0.3;
}
function buildMountains() {
  const NR = QN === 'low' ? 60 : 90, NA = QN === 'low' ? 420 : 720;
  const r0 = 1450, r1 = 15000;
  const pos = new Float32Array(NR * NA * 3);
  for (let j = 0; j < NR; j++) {
    const r = r0 * Math.pow(r1 / r0, j / (NR - 1));
    for (let i = 0; i < NA; i++) {
      const a = i / NA * Math.PI * 2;
      const x = Math.sin(a) * r, z = -Math.cos(a) * r, k = (j * NA + i) * 3;
      pos[k] = x; pos[k + 1] = mountainH(x, z); pos[k + 2] = z;
    }
  }
  const idx = [];
  for (let j = 0; j < NR - 1; j++) for (let i = 0; i < NA; i++) {
    const a0 = j * NA + i, b0 = j * NA + (i + 1) % NA, c0 = a0 + NA, d0 = b0 + NA;
    idx.push(a0, b0, c0, b0, d0, c0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const mat = stdMat({ color: 0xffffff, roughness: 0.95 }, {
    key: 'mountains', noCloud: false,
    fColor: /* glsl */`
      vec2 q = vWorldP.xz;
      float slope = 1.0 - normalize(vWorldN).y;
      float n = fbm2(q*0.0021), m = vnoise(q*0.02);
      vec3 meadow = mix(srgb2lin(vec3(0.42, 0.40, 0.21)), srgb2lin(vec3(0.58, 0.48, 0.30)), n);
      vec3 forest = srgb2lin(vec3(0.13, 0.16, 0.09));
      vec3 rockc = srgb2lin(vec3(0.40, 0.38, 0.36));
      vec3 col = mix(meadow, forest, smoothstep(0.45, 0.6, n + (m - 0.5)*0.3) * (1.0 - smoothstep(380.0, 520.0, vWorldP.y)));
      col = mix(col, rockc*(0.7 + 0.5*m), smoothstep(0.25, 0.5, slope + (m - 0.5)*0.2));
      diffuseColor.rgb = col * (0.8 + 0.4*m);`,
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  return mesh;
}

/* =====================================================================
   SKY, BLACK HOLE (geodesic ray-traced), CLOUDS, STARS
   ===================================================================== */
// virtual observer around the hole (units of Schwarzschild radius)
const BH_D = 30.0, BH_TILT = 2.4 * DEG, BH_ROLL = -1.2 * DEG;
const BH_CAMPOS = V3(0, Math.sin(BH_TILT) * BH_D, -Math.cos(BH_TILT) * BH_D);
const BH_CAMROT = (() => {
  const f = BH_CAMPOS.clone().negate().normalize();
  let r = new THREE.Vector3().crossVectors(V3(0, 1, 0), f).normalize();
  let u = new THREE.Vector3().crossVectors(f, r).normalize();
  // roll
  const cr = Math.cos(BH_ROLL), sr = Math.sin(BH_ROLL);
  const r2 = r.clone().multiplyScalar(cr).add(u.clone().multiplyScalar(sr));
  const u2 = u.clone().multiplyScalar(cr).sub(r.clone().multiplyScalar(sr));
  // camera frame columns: right (x), up (y), forward (z) — tangent coords use x right, y up, z forward
  return new THREE.Matrix3().set(r2.x, u2.x, f.x, r2.y, u2.y, f.y, r2.z, u2.z, f.z);
})();

const SKY_UNIFORMS = {
  uBHCamPos: { value: BH_CAMPOS },
  uBHCamRot: { value: BH_CAMROT },
  uBHSteps: { value: Q.bhSteps },
  uBHExtent: { value: 0.62 },
  uDiskBright: { value: 1 },
  uStars: { value: 0 },
  uEnvPass: { value: 0 },
};

const SKY_GLSL = /* glsl */`
uniform vec3 uBHCamPos; uniform mat3 uBHCamRot; uniform float uBHSteps; uniform float uBHExtent;
uniform float uDiskBright; uniform float uStars; uniform float uEnvPass;
const float RIN = 2.75, ROUT = 13.5;
float gPix = 0.001;

vec3 diskPalette(float x){
  // x: 0 = cool outer plasma, 1 = hottest inner region
  vec3 d0 = vec3(0.30, 0.075, 0.018), d1 = vec3(0.92, 0.36, 0.085), d2 = vec3(1.0, 0.66, 0.30), d3 = vec3(1.0, 0.86, 0.62), d4 = vec3(1.0, 0.97, 0.90);
  vec3 n0 = vec3(0.24, 0.02, 0.22), n1 = vec3(0.50, 0.06, 0.62), n2 = vec3(0.52, 0.22, 1.0), n3 = vec3(0.72, 0.56, 1.0), n4 = vec3(0.94, 0.90, 1.0);
  vec3 c0 = mix(d0, n0, uNight), c1 = mix(d1, n1, uNight), c2 = mix(d2, n2, uNight), c3 = mix(d3, n3, uNight), c4 = mix(d4, n4, uNight);
  x = clamp(x, 0.0, 1.0) * 4.0;
  if (x < 1.0) return mix(c0, c1, x);
  if (x < 2.0) return mix(c1, c2, x - 1.0);
  if (x < 3.0) return mix(c2, c3, x - 2.0);
  return mix(c3, c4, x - 3.0);
}

float diskPattern(float r, float ph, float seed){
  vec2 cs = vec2(cos(ph), sin(ph));
  float n1 = vnoise3(vec3(cs*2.1, r*2.2 + seed));
  float n2 = vnoise3(vec3(cs*4.8 + 7.0, r*6.3 - seed));
  float n3 = vnoise3(vec3(cs*10.5 - 3.0, r*17.0 + seed*1.7));
  float n4 = vnoise3(vec3(cs*22.0 + 1.0, r*41.0 - seed));
  float bands = 0.5 + 0.5*sin(r*7.5 + n1*5.0 + seed);
  float fil = pow(n3, 2.2)*1.3 + pow(n4, 3.0)*0.9;
  return clamp(0.20 + 0.55*n1*n2*1.6 + 0.35*bands*n2 + fil*0.55, 0.0, 2.2);
}

// returns rgb emission + alpha for one crossing of the disk plane
vec4 diskSample(vec3 hp, float r, vec3 rdir){
  float phi = atan(hp.z, hp.x);
  float inner = smoothstep(RIN*0.92, RIN*1.22, r);
  float outer = 1.0 - smoothstep(ROUT*0.45, ROUT, r);
  float prof = inner * outer * pow(RIN / r, 1.35);
  float om = 0.85 * pow(r, -1.5);
  const float TP = 80.0;
  float tA = mod(uTime, TP), tB = mod(uTime + TP*0.5, TP);
  float wA = 1.0 - abs(tA / TP * 2.0 - 1.0);
  float sA = floor(uTime / TP) * 3.17, sB = floor((uTime + TP*0.5) / TP) * 3.17 + 11.0;
  float n = diskPattern(r, phi - om*tA, sA) * wA + diskPattern(r, phi - om*tB, sB) * (1.0 - wA);
  float dens = prof * n;
  // relativistic Doppler beaming + gravitational redshift
  vec3 vdir = normalize(vec3(-hp.z, 0.0, hp.x));
  float beta = min(sqrt(0.5 / max(r - 1.0, 0.6)), 0.62);
  float gam = 1.0 / sqrt(1.0 - beta*beta);
  float g = sqrt(1.0 - 1.0 / r) / (gam * (1.0 + beta * dot(vdir, rdir)));
  float boost = mix(1.0, pow(g, 2.5), 0.8);
  float temp = clamp(pow(RIN / r, 0.75) * (0.62 + 0.45*n) * mix(1.0, g, 0.7), 0.0, 1.0);
  vec3 c = diskPalette(temp) * dens * boost * 7.5 * uDiskBright;
  c *= 14.0 / (14.0 + dot(c, vec3(0.3, 0.5, 0.2)));
  float thick = 0.10 + 0.08*n;
  float a = 1.0 - exp(-dens * thick * 7.0 / max(abs(rdir.y), 0.045));
  return vec4(c * (0.35 + 0.65*a), clamp(a, 0.0, 0.97));
}

vec3 bhToWorld(vec3 bdir){
  vec3 lc = bdir * uBHCamRot; // into camera tangent frame
  if (lc.z < 0.02) lc.z = 0.02;
  vec2 p = lc.xy / lc.z;
  return normalize(uBHBasis * normalize(vec3(p, 1.0)));
}

// trace a view direction through the curved space-time of the hole
vec3 traceBH(vec3 wdir, out vec3 escW, out float occl){
  occl = 0.0; escW = wdir;
  vec3 l = wdir * uBHBasis;
  if (l.z < 0.3) return vec3(0.0);
  vec2 p = l.xy / l.z;
  if (length(p * vec2(0.9, 1.25)) > uBHExtent) return vec3(0.0);
  vec3 rd = uBHCamRot * normalize(vec3(p, 1.0));
  vec3 pos = uBHCamPos;
  float bproj = dot(pos, rd);
  vec3 cperp = pos - rd * bproj; float b2 = dot(cperp, cperp);
  const float R0 = 15.0;
  if (b2 > R0*R0){
    float b = sqrt(b2);
    vec3 dout = normalize(rd - normalize(cperp) * (2.0 / b));
    escW = bhToWorld(dout);
    return vec3(0.0);
  }
  pos += rd * max(-bproj - sqrt(R0*R0 - b2), 0.0);
  vec3 vel = rd;
  vec3 hv = cross(pos, vel); float h2 = dot(hv, hv);
  vec3 col = vec3(0.0); float T = 1.0; bool cap = false;
  for (int i = 0; i < 200; i++){
    if (float(i) >= uBHSteps) { cap = true; break; }
    float r2 = dot(pos, pos); float r = sqrt(r2);
    float dt = clamp((r - 0.85) * 0.105, 0.012, 1.3);
    vec3 prev = pos;
    vec3 acc = -1.5 * h2 * pos / (r2*r2*r);
    pos += vel*dt + 0.5*acc*dt*dt;
    float r2n = dot(pos, pos);
    vec3 accn = -1.5 * h2 * pos / (r2n*r2n*sqrt(r2n));
    vel += 0.5*(acc + accn)*dt;
    if (prev.y * pos.y < 0.0){
      float f = prev.y / (prev.y - pos.y);
      vec3 hp = mix(prev, pos, f);
      float rr = length(hp.xz);
      if (rr > RIN*0.9 && rr < ROUT){
        vec4 e = diskSample(hp, rr, normalize(vel));
        col += T * e.rgb; T *= 1.0 - e.a;
      }
    }
    if (r2n < 1.0){ cap = true; break; }
    if (r2n > 420.0 && dot(pos, vel) > 0.0) break;
    if (T < 0.015) break;
  }
  // razor-thin photon ring (critical impact parameter b = 3*sqrt(3)/2)
  float bimp = sqrt(h2);
  float pw = gPix * 30.0;
  float ring = exp(-pow((bimp - 2.598) / (0.006 + pw*0.35), 2.0));
  float ringSide = 0.55 + 0.45 * clamp(-(uBHCamRot * normalize(vec3(p, 1.0))).x * 6.0 + 0.5, 0.0, 1.0);
  col += diskPalette(0.95) * ring * 3.6 * ringSide * uDiskBright * T;
  escW = cap ? wdir : bhToWorld(normalize(vel));
  occl = cap ? 1.0 : 1.0 - T;
  return col;
}

vec3 starField(vec3 d){
  vec3 c = vec3(0.0);
  for (int k = 0; k < 2; k++){
    float sc = k == 0 ? 160.0 : 420.0;
    vec3 p = d * sc;
    vec3 id = floor(p);
    float h = hash13(id + float(k)*17.0);
    float th = k == 0 ? 0.955 : 0.93;
    if (h > th){
      vec3 sp = id + 0.5 + (vec3(hash13(id + 1.3), hash13(id + 2.7), hash13(id + 5.1)) - 0.5) * 0.7;
      float dd = length(p - sp);
      float br = pow((h - th) / (1.0 - th), 2.0) * (k == 0 ? 2.2 : 0.6);
      float tw = 0.75 + 0.25*sin(uTime*(1.5 + h*4.0) + h*60.0);
      vec3 tint = mix(vec3(0.75, 0.82, 1.0), vec3(1.0, 0.85, 0.7), hash13(id + 9.0));
      c += tint * br * tw * exp(-dd*dd*(k == 0 ? 26.0 : 40.0));
    }
  }
  // faint galactic band
  vec3 gp = normalize(vec3(0.35, 0.62, -0.7));
  float band = exp(-pow(dot(d, gp) * 3.4, 2.0));
  float dust = fbm3(d * 6.0);
  c += vec3(0.55, 0.58, 0.75) * band * smoothstep(0.35, 0.8, dust) * 0.035;
  return c;
}

vec4 clouds(vec3 d){
  if (d.y < 0.0) return vec4(0.0);
  float hgt = d.y + 0.045;
  vec2 uv = d.xz / hgt * 0.55 + uCloudOff * 1.6;
  float t = uTime * 0.012;
  float base = fbm3(vec3(uv * 0.55, t));
  float det = fbm3(vec3(uv * 2.3 + 4.0, t * 2.0));
  float cov = mix(0.66, 0.6, smoothstep(0.05, 0.5, d.y));
  float c = smoothstep(cov, cov + 0.22, base * 0.78 + det * 0.32);
  // wispy high cirrus streaks
  float cir = fbm3(vec3(uv.x * 0.35, uv.y * 2.6, t * 0.7) + 9.0);
  c = max(c, smoothstep(0.62, 0.85, cir) * 0.4);
  c *= smoothstep(0.0, 0.07, d.y) * uCloudCov;
  // lighting
  float sd = max(dot(d, uSunDir), 0.0);
  float thin = 1.0 - smoothstep(0.3, 1.0, c);
  vec3 dayC = mix(vec3(0.78, 0.74, 0.76), vec3(1.25, 0.98, 0.72), smoothstep(0.2, 0.9, det)) ;
  dayC += vec3(1.3, 0.85, 0.5) * pow(sd, 6.0) * (0.6 + 1.4*thin);
  vec3 duskC = mix(vec3(0.55, 0.32, 0.38), vec3(1.3, 0.55, 0.28), smoothstep(0.2, 0.9, det) * pow(sd, 1.5));
  vec3 nightC = vec3(0.020, 0.018, 0.04) + uBHGlow * 0.10 * (0.4 + 1.2*thin) * exp(-max(d.y, 0.0) * 3.0);
  vec3 cc = mix(dayC * (0.55 + 0.45*uSunUp), duskC, uDusk);
  cc = mix(cc, nightC, uSkyN);
  cc += bhGlow(d) * (0.35 + 0.8*thin);
  return vec4(cc, c * 0.92);
}

vec3 skyColor(vec3 d){
  vec3 base = skyBase(d);
  vec3 col = base + bhGlow(d);
  vec3 esc; float occl;
  vec3 bh = traceBH(d, esc, occl);
  // the atmosphere sits in front of the hole: a faint veil keeps the shadow black yet natural
  col = col * (1.0 - occl * 0.985) + bh;
  vec3 lt = d * uBHBasis; float pr = lt.z > 0.0 ? length(lt.xy / lt.z) : 9.0;
  vec3 sd = normalize(mix(d, esc, 0.1 + 0.9*smoothstep(0.17, 0.095, pr)));
  float starVis = uStars * (1.0 - occl) * smoothstep(-0.02, 0.12, sd.y);
  if (starVis > 0.003 && uEnvPass < 0.5) col += starField(sd) * starVis;
  vec4 cl = clouds(d);
  cl.a *= 1.0 - 0.9*exp(-pr*pr / 0.06);
  col = mix(col, cl.rgb, cl.a * (uEnvPass > 0.5 ? 0.8 : 1.0));
  if (uEnvPass > 0.5) col *= mix(1.0, 0.4, uSkyN);
  return col;
}
`;

function buildSky() {
  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, SKY_UNIFORMS),
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
    fragmentShader: GLSL_COMMON + SKY_GLSL + /* glsl */`
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        gPix = length(fwidth(d));
        vec3 c = skyColor(d);
        gl_FragColor = vec4(c, 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false, depthTest: false,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(500, 96, 48), mat);
  mesh.renderOrder = -1000;
  mesh.frustumCulled = false;
  return mesh;
}

const _lv = new THREE.Vector3();
function placeShadowLight(light, dir, center, extent) {
  // snap the light-space origin to texels to keep shadows stable while walking
  const texel = (2 * extent) / light.shadow.mapSize.x;
  const m = new THREE.Matrix4().lookAt(V3(0, 0, 0), dir.clone().negate(), V3(0, 1, 0));
  const inv = m.clone().invert();
  _lv.copy(center).applyMatrix4(inv);
  _lv.x = Math.round(_lv.x / texel) * texel; _lv.y = Math.round(_lv.y / texel) * texel;
  _lv.applyMatrix4(m);
  light.target.position.copy(_lv);
  light.position.copy(_lv).addScaledVector(dir, 300);
  light.target.updateMatrixWorld();
}

const GRASS_VS_HEAD = /* glsl */`
attribute vec4 aInst;
attribute float aPart;
uniform float uPatch; uniform float uSpacing; uniform vec4 uLod; uniform float uWidthMul; uniform vec3 uTallZone; uniform vec3 uKeyDir;

function makeVegMaterial(kind) {

    uPatch: { value: 60 }, uSpacing: { value: 0.2 }, uLod: { value: new THREE.Vector4(30, 34, -2, -1) },

}
function barkTextures() {
  const W = 256, Hh = 512, hf = noiseField(W, Hh, 6, 4, 11);

    elm: { len: 6.0, rad: 0.36, depth: 4, spread: 0.5, up: 0.35, kids: [4, 3, 3, 2], lenK: 0.7, wig: 0.15, leafD: 3, leafN: 14, leafS: 1.15 },
    young: { len: 3.0, rad: 0.17, depth: 3, spread: 0.65, up: 0.25, kids: [5, 3, 2], lenK: 0.68, wig: 0.2, leafD: 2, leafN: 15, leafS: 0.95 },

    if (depth >= cfg.leafD) tips.push({ p: cur.clone(), d: d.clone(), s: len });
    if (depth < cfg.depth - 1 || (depth < cfg.depth && rng() < 0.85)) {

    const n = cfg.leafN;

      const c = tip.p.clone().add(V3(rng() - 0.5, rng() - 0.35, rng() - 0.5).multiplyScalar(tip.s * 0.75 + 0.4));
      const s = cfg.leafS * (0.7 + rng() * 0.6);

      const tB = new THREE.Vector3().crossVectors(cardN, tA).normalize();
      const rot = rng() * 6.28, cr = Math.cos(rot), sr = Math.sin(rot);

const colliders = { circles: [], segs: [], boxes: [] };

function placementOK(x, z, clearRoad = 4, clearWater = 2.5, clearHouse = 6) {
  const t = terrainInfo(x, z);
  if (Math.abs(t.road) < clearRoad) return false;
  if (t.edge < clearWater) return false;
  const [lx, lz] = toHouseLocal(x, z);
  if (Math.abs(lx + 2) < 8 + clearHouse && Math.abs(lz - 1.5) < 7.5 + clearHouse) return false;
  return true;
}

function buildTrees() {

  const kinds = ['oak', 'elm', 'young', 'dead', 'wind', 'shrub'];
  const variants = {};
  kinds.forEach((k, i) => { variants[k] = [genTree(1000 + i * 31, k), genTree(2000 + i * 47, k)]; });
  const lists = {}; kinds.forEach(k => lists[k] = [[], []]);
  const add = (k, x, z, s, v = 0, yaw = null, collide = true) => {
    lists[k][v].push([x, H(x, z), z, s, yaw === null ? hash2(Math.round(x * 10), Math.round(z * 10)) * 6.28 : yaw]);
    if (collide && k !== 'shrub') colliders.circles.push([x, z, 0.45 * s]);

  add('oak', -36, -96, 1.3, 0); add('elm', 52, -92, 1.05, 0); add('oak', 6, -96, 0.8, 1);
  add('dead', -55, -33, 1.0, 0); add('young', 66, -57, 1.0, 0); add('oak', -24, 44, 1.0, 1);
  add('wind', 150, -14, 1.0, 0); add('wind', 176, -60, 0.85, 1); add('elm', -74, -158, 1.1, 1); add('young', -36, 74, 0.9, 1);

  for (const [cx, cz, n0] of clusters) {
    const n = Math.round(n0 * Q.forest);

      const a = rng() * 6.28, r = Math.sqrt(rng()) * (12 + n0 * 1.3);

    }
  }
  // a hedgerow folding across the middle distance
  for (let i = 0; i < 60; i++) {
    const t = i / 59, x = lerp(-260, 210, t) + (rng() - 0.5) * 6, z = lerp(-170, -235, t) + Math.sin(t * 9) * 14 + (rng() - 0.5) * 6;
    if (!placementOK(x, z, 5, 3, 10)) continue;
    add(rng() < 0.7 ? 'young' : 'oak', x, z, 0.55 + rng() * 0.45, rng() < 0.5 ? 0 : 1, null, false);
  }
  // isolated field trees & shrubs
  for (let i = 0; i < 12; i++) {
    const x = (rng() - 0.5) * 900, z = (rng() - 0.5) * 900 - 120;
    if (Math.hypot(x - OPENING.x, z - OPENING.z) < 40 || !placementOK(x, z, 5, 3, 12)) continue;
    add(rng() < 0.25 ? 'dead' : rng() < 0.6 ? 'young' : 'oak', x, z, 0.7 + rng() * 0.5, rng() < 0.5 ? 0 : 1);
  }
  // flowering shrubs and bushes (yard, fence line, stream banks, scattered)
  const shrubSpots = [];
  for (const [lx, lz] of [[-5.3, -4.2], [5.2, -4.0], [5.6, 2.2], [-5.3, 1.2], [5.6, 5.4], [-5.5, 5.3], [3.9, 7.0]]) shrubSpots.push(fromHouseLocal(lx, lz));
  for (let i = 0; i < 80; i++) {
    const s = STREAM_PTS[Math.floor(rng() * STREAM_PTS.length)];
    const x = s[0] + (rng() - 0.5) * 12, z = s[1] + (rng() - 0.5) * 12;
    if (Math.abs(z) < 500 && Math.abs(x) < 500 && terrainInfo(x, z).edge > 1.2) shrubSpots.push([x, z]);
  }
  for (let i = 0; i < 70; i++) {
    const x = (rng() - 0.5) * 600, z = (rng() - 0.5) * 600 - 100;
    if (Math.hypot(x - OPENING.x, z - OPENING.z) < 14) continue;
    if (placementOK(x, z, 3.5, 1.5, 2)) shrubSpots.push([x, z]);

  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (const k of kinds) for (let v = 0; v < 2; v++) {
    const list = lists[k][v]; if (!list.length) continue;
    const T = variants[k][v];
    const leafTex = k === 'shrub' && v === 0 ? BLOSSOM_TEX : LEAF_TEX;
    const mats = treeMaterials(T.height, k === 'shrub' ? 0.25 : k === 'young' || k === 'wind' ? 0.12 : 0.06, T.leaves ? leafTex : null);
    const make = (geo, mat, depth) => {
      const im = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach(([x, y, z, s, yaw], i) => { q.setFromAxisAngle(V3(0, 1, 0), yaw); m4.compose(V3(x, y, z), q, V3(s, s * (0.9 + 0.2 * hash2(i, v)), s)); im.setMatrixAt(i, m4); });

/* ---------- rocks, stones, pebbles, leaf litter ---------- */
function rockGeometry(seed, detail, flat = 0.75) {
  let g = new THREE.IcosahedronGeometry(1, detail);

  const p = g.attributes.position, v = V3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = fbm(v.x * 1.3 + seed, v.y * 1.3 + v.z * 0.7, 4);
    const r = 0.72 + n * 0.55 + 0.08 * Math.sin(v.x * 4 + seed);
    v.multiplyScalar(r); v.y *= flat; if (v.y < -0.1) v.y *= 0.4;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

    key: 'litter', fColor: 'diffuseColor.rgb = mix(diffuseColor.rgb, vec3(dot(diffuseColor.rgb, vec3(0.33))) * vec3(1.5, 0.95, 0.5), 0.85);',
  });
  const litter = [];
  for (const im of [[-36, -96, 9], [6, -96, 6], [52, -92, 7], [-24, 44, 7], [95, -130, 8]]) {
    for (let i = 0; i < 160; i++) { const a = rng() * 6.28, r = Math.sqrt(rng()) * im[2]; litter.push([im[0] + Math.cos(a) * r, im[1] + Math.sin(a) * r]); }
  }

  const uvs = lg.attributes.uv; for (let i = 0; i < uvs.count; i++) uvs.setXY(i, uvs.getX(i) * 0.5, 0.5 + uvs.getY(i) * 0.5);

function buildFence() {
  const group = new THREE.Group();
  const WW = weatheredWood();
  const mat = stdMat({ map: WW.map, normalMap: WW.normal, color: 0xc8bba8, roughness: 0.9 }, { key: 'fence', fColor: 'diffuseColor.rgb *= mix(vec3(0.62, 0.66, 0.5), vec3(1.0), smoothstep(0.0, 0.45, vWorldP.y - bthWorld(vWorldP.xz).r));' });
  const rng = mulberry32(99);
  const posts = [], rails = [];
  for (let s = 0; s < FENCE_PTS.length - 1; s++) {
    const [ax, az] = FENCE_PTS[s], [bx, bz] = FENCE_PTS[s + 1];
    const len = Math.hypot(bx - ax, bz - az);
    if (len < 4) continue; // gap: the road passes here
    const n = Math.max(1, Math.round(len / 2.4));
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = ax + (bx - ax) * t, z = az + (bz - az) * t;
      if (i === n && s < FENCE_PTS.length - 2 && Math.hypot(FENCE_PTS[s + 2][0] - bx, FENCE_PTS[s + 2][1] - bz) >= 4) continue;
      if (rng() < 0.08 && i > 0 && i < n) continue; // a missing post
      const broken = rng() < 0.12;
      posts.push({ x, z, h: broken ? 0.55 + rng() * 0.3 : 1.18 + rng() * 0.12, lx: (rng() - 0.5) * 0.14, lz: (rng() - 0.5) * 0.14, yaw: Math.atan2(bz - az, bx - ax) + (rng() - 0.5) * 0.3 });
      colliders.circles.push([x, z, 0.12]);
    }
  }
  for (let i = 0; i < posts.length - 1; i++) {
    const a = posts[i], b = posts[i + 1];
    const d = Math.hypot(b.x - a.x, b.z - a.z); if (d > 3.2) continue;
    for (const hgt of [0.45, 0.95]) {
      const r = rng();
      if (r < 0.14) continue; // missing rail
      const ya = H(a.x, a.z) + hgt, yb = H(b.x, b.z) + hgt;
      if (r < 0.26 || (hgt > 0.6 && (a.h < 1 || b.h < 1))) {
        // fallen rail: one end dropped into the grass
        const end = rng() < 0.5;
        rails.push({ a: [a.x, end ? ya : H(a.x, a.z) + 0.05, a.z], b: [b.x, end ? H(b.x, b.z) + 0.05 : yb, b.z], fall: true });
      } else {
        rails.push({ a: [a.x, ya, a.z], b: [b.x, yb, b.z] });
        if (hgt > 0.6) colliders.segs.push([a.x, a.z, b.x, b.z]);
      }
    }
  }
  const pg = new THREE.BoxGeometry(0.11, 1, 0.11); pg.translate(0, 0.5, 0);
  { const p = pg.attributes.position; for (let i = 0; i < p.count; i++) if (p.getY(i) > 0.99) p.setY(i, p.getY(i) + (p.getX(i) > 0 ? 0.03 : -0.02)); pg.computeVertexNormals(); }
  const pim = new THREE.InstancedMesh(pg, mat, posts.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  posts.forEach((p, i) => { e.set(p.lx, p.yaw, p.lz); q.setFromEuler(e); m4.compose(V3(p.x, H(p.x, p.z) - 0.15, p.z), q, V3(1, p.h + 0.15, 1)); pim.setMatrixAt(i, m4); });
  pim.castShadow = pim.receiveShadow = true; pim.computeBoundingSphere(); group.add(pim);
  const rg = new THREE.BoxGeometry(1, 0.1, 0.035);
  const rim = new THREE.InstancedMesh(rg, mat, rails.length);
  rails.forEach((r, i) => {
    const a = V3(...r.a), b = V3(...r.b), d = b.clone().sub(a), len = d.length();
    q.setFromUnitVectors(V3(1, 0, 0), d.normalize());
    const twist = new THREE.Quaternion().setFromAxisAngle(V3(1, 0, 0), r.fall ? 0.6 : (rng() - 0.5) * 0.08);
    q.multiply(twist);
    m4.compose(a.clone().add(b).multiplyScalar(0.5).add(V3(0, 0, 0.07)), q, V3(len + 0.15, 1, 1)); rim.setMatrixAt(i, m4);
  });
  rim.castShadow = rim.receiveShadow = true; rim.computeBoundingSphere(); group.add(rim);
  // broken gate lying by the road
  const gate = new THREE.Group();
  for (const y of [0.15, 0.55, 0.95]) { const b = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, 0.04), mat); b.position.y = y; gate.add(b); }
  for (const x of [-1.25, 1.25]) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.05, 0.045), mat); b.position.set(x, 0.55, 0.01); gate.add(b); }
  { const b = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.1, 0.04), mat); b.rotation.z = 0.36; b.position.set(0, 0.55, 0.02); gate.add(b); }
  gate.position.set(-4.4, H(-4.4, -27.5) + 0.06, -27.5); gate.rotation.set(-Math.PI / 2 + 0.12, 0.4, 0.05);
  gate.traverse(o => { o.castShadow = o.receiveShadow = true; });
  group.add(gate);
  return group;
}

function buildStream() {

      attribute vec2 aFlow; varying vec3 vWP; varying vec2 vUV; varying vec2 vFlow;

const GradeShader = {

    varying vec2 vUv;

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
const clockT = new THREE.Clock();
let shadowTimer = 0;
function frame(dt) {
  state.time += dt;
  const t = state.time;
  U.uTime.value = t;
  // transition (~5 s, eased)
  const prevTr = state.tr;
  const step = dt / 5.0;
  state.tr = state.tr < state.target ? Math.min(state.target, state.tr + step) : Math.max(state.target, state.tr - step);
  const trE = state.tr * state.tr * (3 - 2 * state.tr);
  if (state.tr !== prevTr) state.envDirty = true;
  applyLighting(trE);
  // wind: slow breathing of strength with occasional gusts
  const gustEnv = smoothstep(0.35, 0.85, noise2(t * 0.035, 3.1)) ;
  U.uGust.value = 0.3 + gustEnv * 0.9;
  U.uWindStr.value = WIND_LEVELS[state.wind] * (0.7 + 0.45 * noise2(t * 0.06, 7.7) + 0.35 * gustEnv);
  U.uCloudOff.value.addScaledVector(U.uWindDir.value, dt * 0.0016 * (0.6 + U.uWindStr.value));
  // camera
  if (state.mode === 'cine') updateCinematic(dt, t); else updatePlayer(dt);
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  // follow-shadows: a frustum leaning ahead of the view
  _f.set(0, 0, -1).applyQuaternion(camera.quaternion); _f.y = 0; _f.normalize();
  const center = camera.position.clone().addScaledVector(_f, 34); center.y = H(center.x, center.z);
  placeShadowLight(sun, U.uSunDir.value, center, 70);
  placeShadowLight(bhLight, BH_LIGHT_DIR, center, 60);
  // living details
  if (screenDoor) screenDoor.userData.pivot.rotation.y = 0.42 + Math.sin(t * 0.9) * 0.05 * (0.4 + U.uWindStr.value) + Math.sin(t * 2.3) * 0.015 * U.uWindStr.value;
  if (rockingChair) rockingChair.rotation.z = Math.sin(t * 1.05) * 0.035 * (0.3 + U.uWindStr.value);
  if (lanternFlame) { const f = 0.9 + 0.1 * Math.sin(t * 13) * Math.sin(t * 7.3); lanternFlame.scale.set(f, 1.7 * f, f); porchLantern.intensity *= f; }
  interiorLights.forEach((l, i) => { l.intensity = l.userData.base * (0.97 + 0.03 * Math.sin(t * (3 + i) + i)); });
  updateBirds(t, U.uSkyN.value);
  // environment for reflections & ambient light
  state.envTimer -= dt;
  if (state.envDirty && state.envTimer <= 0) { updateEnvironment(); state.envDirty = false; state.envTimer = 0.2; }
  else if (state.envTimer < -20) { state.envDirty = true; }
  gradePass.uniforms.uExposure.value = exposureFor(trE);
  gradePass.uniforms.uTime.value = t;
  if (!state.noRender) composer.render();
  if (state.shot) { state.shot = false; saveShot(); }
  updateAudio(dt, t);
}
let first = true;
function loop() {
  requestAnimationFrame(loop);
  let dt = Math.min(clockT.getDelta(), 0.1);
  if (PARAMS.has('freeze')) dt = 1 / 60;
  frame(dt);
  adapt(dt);
  if (first) { first = false; setTimeout(() => document.getElementById('veil').classList.add('gone'), 60); }
}

/* ---------- headless inspection hooks (no visible UI) ---------- */
const VIEWS = {
  opening: () => ({ p: gp(OPENING.x, OPENING.z), yaw: OPENING.yaw, pitch: OPENING.pitch }),
  ridge: () => ({ p: gp(166, -36), yaw: 24 * DEG, pitch: 2.5 * DEG }),
  interior: () => ({ p: hl(-0.45, 1.55, 0.25), yaw: -BH_AZ, pitch: 3.5 * DEG }),
  stream: () => ({ p: gp(-3.5, -44, 1.2), yaw: 22 * DEG, pitch: 4 * DEG }),
  porch: () => ({ p: hl(-3.2, 1.6, 12.5), yaw: HOUSE.yaw - 14 * DEG, pitch: 4 * DEG }),
  house: () => ({ p: gp(14, -42), yaw: -24 * DEG, pitch: 5 * DEG }),
  car: () => ({ p: gp(10.5, -52), yaw: -44 * DEG, pitch: -2 * DEG }),
};
function setView(name) {
  const v = VIEWS[name] && VIEWS[name](); if (!v) return;
  state.mode = 'explore';
  player.pos.set(v.p.x, 0, v.p.z); player.yaw = v.yaw; player.pitch = v.pitch; player.vel.set(0, 0, 0);
  player.eye = v.p.y; state.envDirty = true; state.envTimer = 0;
}
window.__bth = {
  ready: false,
  setView, setNight: (v) => { state.target = state.tr = v ? 1 : 0; state.envDirty = true; state.envTimer = 0; syncUI(); },
  render: (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) frame(dt); },
  sim: (n = 1, dt = 1 / 60) => { state.noRender = true; for (let i = 0; i < n; i++) frame(dt); state.noRender = false; },
  setMode, state, player, camera, toggleNight, dbg: { SKY_UNIFORMS, particles, U, sky, scene, walkHeight, toHouseLocal, fromHouseLocal, FLOOR_Y, H, HOUSE, input, CAR },
  info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geo: renderer.info.memory.geometries, tex: renderer.info.memory.textures, pr: pixelRatio, q: QN }),
};
if (PARAMS.get('view')) setView(PARAMS.get('view'));
if (PARAMS.get('mode') === 'cine') setMode('cine');
applyLighting(state.tr);
updateEnvironment();
if (PARAMS.has('manual')) { window.__bth.ready = true; document.getElementById('veil').classList.add('gone'); }
else { loop(); window.__bth.ready = true; }
</script>
